data:
  path: SuperWing_Dataset
  split_manifest: null
  normalization_stats_path: null
  train_ratio: 0.8
  val_ratio: 0.1
  split_seed: 0
  gen_params_columns:
  - 2
  - 3
  gen_params_names:
  - aoa
  - mach
  normalization_max_target_samples: 4096
  surface_points: 4096
  target_encoder_points: 4096
  query_points: 4096
  normalize_xyz: true
  train_deterministic_sampling: false
  eval_deterministic_sampling: true
  eval_full_grid_query: true
  val_return_origingeom: true
  num_workers: 8
  pin_memory: true
  prefetch_factor: 4
model:
  _target_: physicsnemo.experimental.models.aerojepa.AeroJEPA
  trunk:
    _target_: physicsnemo.experimental.models.aerojepa.AeroJEPATrunk
    include_geometry_global_in_decoder_cond: false
    mask_prediction_enabled: false
    context_encoder:
      _target_: physicsnemo.experimental.models.aerojepa.ContextTransformer
      point_input_dim: 3
      token_dim: 128
      max_point_tokens: 512
      tokenizer_strategy: fps_cluster
      tokenizer_cluster_size: 16
      tokenizer_knn_chunk_size: 128
      point_pos_pe_bands: 6
      num_heads: 4
      num_layers: 4
      neighbor_k: 16
      mlp_ratio: 4
      dropout: 0.0
      use_sdf: false
      use_solid_normals: false
      use_solid_n_dot_uinf: false
    target_encoder:
      _target_: physicsnemo.experimental.models.aerojepa.TargetTransformer
      point_input_dim: 6
      token_dim: 128
      max_point_tokens: 512
      tokenizer_strategy: fps_cluster
      tokenizer_cluster_size: 16
      tokenizer_knn_chunk_size: 128
      point_pos_pe_bands: 6
      num_heads: 4
      num_layers: 4
      neighbor_k: 16
      mlp_ratio: 4
      dropout: 0.0
    decoder:
      _target_: physicsnemo.experimental.models.aerojepa.QueryTokenDecoder
      token_dim: 128
      hidden_dim: 128
      num_layers: 4
      out_dim: 3
      use_sdf: false
      cond_dim: 2
      pe_num_bands: 16
      cross_attention_heads: 4
      cross_attention_layers: 4
      cross_attention_k: 8
      attention_mlp_ratio: 4
      dropout: 0.0
      query_chunk_size: 1024
  predictor:
    _target_: physicsnemo.experimental.models.aerojepa.PrototypeTokenJEPAHead
    token_dim: 128
    cond_dim: 2
    hidden_dim: 128
    depth: 4
    num_heads: 4
    neighbor_k: 8
    query_pe_bands: 6
    mlp_ratio: 4
    dropout: 0.0
training:
  epochs: 200
  batch_size: 1
  eval_batch_size: 1
  max_eval_batches: 4
  precision: bf16
  save_every_epochs: 10
  log_every: 50
  max_train_batches: null
  profile: false
  profile_steps: 12
  optimizer:
    _target_: torch.optim.AdamW
    lr: 0.001
    weight_decay: 0.001
    betas:
    - 0.9
    - 0.95
  scheduler:
    name: warmup_cosine
    warmup_epochs: 2
  grad_clip_norm: 10.0
  ema:
    enabled: true
    decay: 0.999
  loss:
    recon:
      kind: relative_l2_mse
      relative_mse_mode: pointwise
      eps: 0.01
      relative_l2_weight: 1.0
      mse_weight: 0.2
      weight: 1.0
      warmup_epochs: 0
    latent:
      weight: 1.0
      mse_weight: 0.5
      cosine_weight: 0.5
      warmup_epochs: 5
    sigreg:
      weight: 0.01
      warmup_epochs: 5
      knots: 17
      num_proj: 1024
    sigreg_context:
      weight: 0.0
      warmup_epochs: 5
      knots: 17
      num_proj: 1024
  two_phase_training:
    enabled: false
    phase1_epochs: 100
  resume:
    enabled: false
    checkpoint_path: null
    strict: true
    load_optimizer: true
    load_scheduler: true
  init_from_checkpoint:
    path: null
    strict: true
seed: 42
device: cuda
output_dir: outputs
checkpoint_root: outputs
run_name: aerojepa
logging:
  level: INFO
  format: '%(asctime)s - %(name)s - %(levelname)s - %(message)s'
